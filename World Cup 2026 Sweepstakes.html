   Sofia Sans (Google Fonts) is the closest open-source match and is listed in
   Mastercard's own declared fallback stack. It is a VARIABLE font, so the
   load-bearing 450 body weight is preserved exactly.

   To swap in the real MarkForMC: drop the .woff2 files into assets/fonts/ and

<style>
/* ==========================================================================
   COLORS — Mastercard-inspired palette
   Base tokens first, then semantic aliases. Warm cream canvas, ink CTAs,
   signal orange reserved for consent/legal only.
   ========================================================================== */

:root {
  /* --- Brand mark (logo only — NEVER use as UI colors) --- */
  --brand-red:            #EB001B;  /* Mastercard mark left circle  */
  --brand-yellow:         #F79E1B;  /* Mastercard mark right circle */

  /* --- Ink / near-black (warm) --- */
  --ink:                  #141413;  /* primary CTAs, headlines, footer surface */
  --charcoal:             #262627;  /* softer black text alternate */

  /* --- Signal oranges (attention / consent only) --- */
  --signal-orange:        #CF4500;  /* burnt rust — consent & legal CTAs, eyebrow dot */
  --signal-orange-light:  #F37338;  /* carroty — orbital arcs, active carousel dots */
  --clay-brown:           #9A3A0A;  /* deep rust — secondary link-style buttons */

  /* --- Surfaces (warm, never sterile) --- */
  --canvas:               #F3F0EE;  /* page canvas — warm putty cream */
  --cream-lifted:         #FCFBFA;  /* one step lighter — nested raised sections */
  --white:                #FFFFFF;  /* nav pill, modals, satellite CTAs, secondary fills */
  --bone:                 #F4F4F4;  /* cool-gray alt surface */
  --ghost-cream:          #E8E2DA;  /* cream-on-cream watermark headline tone */

  /* --- Text grays --- */
  --slate:                #696969;  /* muted secondary text, eyebrow alt, disabled */
  --granite:              #555555;  /* deeper gray inline body accent */
  --graphite:             #565656;  /* link alternate gray */
  --dust-taupe:           #D1CDC7;  /* whisper / placeholder text — low contrast */

  /* --- Semantic accent --- */
  --link-blue:            #3860BE;  /* inline links, informational callouts */

  /* ---------------------------------------------------------------------- */
  /* SEMANTIC ALIASES                                                       */
  /* ---------------------------------------------------------------------- */

  /* Surfaces */
  --surface-page:         var(--canvas);
  --surface-raised:       var(--cream-lifted);
  --surface-card:         var(--white);
  --surface-alt:          var(--bone);
  --surface-inverse:      var(--ink);

  /* Text */
  --text-heading:         var(--ink);
  --text-body:            var(--ink);          /* paired with weight 450 */
  --text-muted:           var(--slate);
  --text-whisper:         var(--dust-taupe);
  --text-on-inverse:      var(--white);
  --text-link:            var(--link-blue);
  --text-ghost:           var(--ghost-cream);

  /* Actions */
  --action-primary-bg:    var(--ink);
  --action-primary-fg:    var(--canvas);       /* cream, not pure white */
  --action-secondary-bg:  var(--white);
  --action-secondary-fg:  var(--ink);
  --action-consent-bg:    var(--signal-orange);
  --action-consent-fg:    var(--white);

  /* Lines & accents */
  --border-strong:        var(--ink);          /* 1.5px pill outlines */
  --border-hairline:      rgba(20, 20, 19, 0.16);
  --border-on-inverse:    rgba(255, 255, 255, 0.40);
  --accent-orbit:         var(--signal-orange-light);
  --accent-dot:           var(--signal-orange);
}

/* ==========================================================================
   TYPOGRAPHY — one-font system (MarkForMC → Sofia Sans substitute)
   Contrast comes from scale, weight, and letter-spacing — never a 2nd family.
   Weight 450 is load-bearing for body copy. Headlines carry -2% tracking.
   ========================================================================== */

:root {
  /* Families */
  --font-sans: 'Sofia Sans', 'SofiaSans', Arial, sans-serif;
  --font-display: var(--font-sans);
  --font-body: var(--font-sans);

  /* Weights — note the half-step 450 */
  --fw-body:    450;   /* @kind font */
  --fw-medium:  500;   /* @kind font */
  --fw-bold:    700;   /* @kind font */

  /* Type scale (size / line-height / letter-spacing) ---------------------- */

  /* H1 — hero */
  --t-h1-size: 64px;
  --t-h1-lh:   64px;       /* 1:1 tight vertical rhythm */
  --t-h1-ls:   -1.28px;    /* -2% */

  /* H2 — section */
  --t-h2-size: 36px;
  --t-h2-lh:   44px;
  --t-h2-ls:   -0.72px;    /* -2% */

  /* H3 — card title */
  --t-h3-size: 24px;
  --t-h3-lh:   28.8px;     /* 1.2 */
  --t-h3-ls:   -0.48px;    /* -2% */

  /* H4 — subhead (rare) */
  --t-h4-size: 14px;
  --t-h4-lh:   18.2px;     /* 1.3 */
  --t-h4-ls:   normal;     /* @kind other */

  /* Eyebrow (H5) — uppercase + accent dot */
  --t-eyebrow-size: 14px;
  --t-eyebrow-lh:   14px;
  --t-eyebrow-ls:   0.56px;   /* +4% */

  /* Body paragraph */
  --t-body-size: 16px;
  --t-body-lh:   22.4px;      /* 1.4 */
  --t-body-ls:   normal;      /* @kind other */

  /* Nav link / button label */
  --t-action-size: 16px;
  --t-action-lh:   16px;
  --t-action-ls:   -0.48px;   /* -3% */

  /* Footer link */
  --t-footlink-size: 14px;
  --t-footlink-lh:   20px;
  --t-footlink-ls:   normal;  /* @kind other */

  /* Footer column header */
  --t-foothead-size: 13px;
  --t-foothead-lh:   14px;
  --t-foothead-ls:   0.56px;  /* +4% */

  /* Ghost watermark headline */
  --t-ghost-size: 112px;
  --t-ghost-lh:   1;          /* @kind other */
  --t-ghost-ls:   -2.24px;
}

/* ==========================================================================
   SPACING — 8px base unit, powers-of-8 scale.
   ========================================================================== */

:root {
  --space-1:   8px;
  --space-2:  16px;
  --space-3:  24px;
  --space-4:  32px;
  --space-6:  48px;
  --space-8:  64px;
  --space-12: 96px;
  --space-16: 128px;

  /* Layout */
  --container-max:   1280px;
  --gutter:          48px;     /* desktop horizontal gutter */
  --gutter-wide:     100px;
  --section-pad-y:   128px;    /* desktop section vertical rhythm */
  --section-pad-y-sm: 48px;    /* mobile */
  --card-pad:        40px;     /* desktop card internal */
  --card-pad-sm:     24px;     /* mobile card internal */
  --nav-top:         24px;     /* nav pill float gap from viewport top */
}

/* ==========================================================================
   RADIUS — the signature scale. Small (≤6), medium-large (20–40), or
   full-pill (99+). The 8–12 middle ground is deliberately ABSENT.
   ========================================================================== */

:root {
  --radius-xs:    4px;    /* tiny decorative chips, cookie micro-elements */
  --radius-btn:   20px;   /* primary & secondary body CTAs — the signature */
  --radius-consent: 24px; /* consent / orange pill buttons */
  --radius-stadium: 40px; /* hero media frames, large containers, H2 pill labels */
  --radius-circle: 50%;   /* circular portraits, icon buttons, satellite CTAs */
  --radius-pill:  999px;  /* nav, carousel cards, country selector, chips */
}

/* ==========================================================================
   ELEVATION — atmospheric cushioning, not directional light.
   Large spreads, very low opacity. Borders preferred for functional lines.
   ========================================================================== */

:root {
  --shadow-0: none;
  --shadow-1: rgba(0, 0, 0, 0.04) 0px 4px 24px 0px;     /* floating nav pill */
  --shadow-2: rgba(0, 0, 0, 0.08) 0px 24px 48px 0px;    /* hero frames, elevated cards */
  --shadow-3: rgba(0, 0, 0, 0.25) 0px 70px 110px 0px;   /* rare dramatic feature tile */
}

/* ==========================================================================
   BASE — light reset + foundational element defaults + a few utility classes
   that encode the brand's signature treatments (eyebrow, ghost headline).
   ========================================================================== */

*,
*::before,
*::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--surface-page);
  color: var(--text-body);
  font-family: var(--font-body);
  font-weight: var(--fw-body);
  font-size: var(--t-body-size);
  line-height: var(--t-body-lh);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Headings ---------------------------------------------------------------- */
h1, h2, h3, h4 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: var(--fw-medium);
  color: var(--text-heading);
  text-wrap: balance;
}
h1 { font-size: var(--t-h1-size); line-height: var(--t-h1-lh); letter-spacing: var(--t-h1-ls); }
h2 { font-size: var(--t-h2-size); line-height: var(--t-h2-lh); letter-spacing: var(--t-h2-ls); }
h3 { font-size: var(--t-h3-size); line-height: var(--t-h3-lh); letter-spacing: var(--t-h3-ls); }
h4 { font-size: var(--t-h4-size); line-height: var(--t-h4-lh); font-weight: var(--fw-bold); }

p { margin: 0; text-wrap: pretty; }

a { color: inherit; text-decoration: none; }

/* Eyebrow label — accent dot + uppercase tracking. The dot is the identity. */
.mc-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  font-size: var(--t-eyebrow-size);
  line-height: var(--t-eyebrow-lh);
  letter-spacing: var(--t-eyebrow-ls);
  font-weight: var(--fw-bold);
  text-transform: uppercase;
  color: var(--text-heading);
}
.mc-eyebrow::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: var(--radius-circle);
  background: var(--accent-dot);
  flex: none;
}

/* Ghost watermark headline — cream-on-cream, sits behind portraits. */
.mc-ghost {
  font-family: var(--font-display);
  font-weight: var(--fw-medium);
  font-size: var(--t-ghost-size);
  line-height: var(--t-ghost-lh);
  letter-spacing: var(--t-ghost-ls);
  color: var(--text-ghost);
  user-select: none;
  pointer-events: none;
}

/* Generic section container */
.mc-container {
  width: 100%;
  max-width: var(--container-max);
  margin-inline: auto;
  padding-inline: var(--gutter);
}


</style>

<script>
/* =========================================================================
   World Cup 2026 — Office Sweepstakes data
   Schema mirrors the source repo (thisispatt/worldcup2026 · src/data.js):
     entries[]   { name, team }
     groups{}    { A: [ {name, flag, played, won, drawn, lost, gf, ga, status} ] }
     fixtures[]  { id, group, round, date, time, home, away, score1, score2, played }
     knockout{}  rounds of { id, home, away, score1, score2, played, date, time }
     teamStatus{} override map for knockout
     prize{}     pot config
   Flags are REAL national flags (flagcdn SVG), never emoji — keyed by ISO code.
   Attaches to window.WC.
   ========================================================================= */
(function () {
  // ---- ISO 3166 alpha-2 (flagcdn) codes for every nation in play ----------
  const CODE = {
    Canada: 'ca', Belgium: 'be', Morocco: 'ma', Japan: 'jp',
    Mexico: 'mx', Croatia: 'hr', Senegal: 'sn', Australia: 'au',
    USA: 'us', Netherlands: 'nl', Ghana: 'gh', Iran: 'ir',
    France: 'fr', Denmark: 'dk', Tunisia: 'tn', Ecuador: 'ec',
    Spain: 'es', Switzerland: 'ch', Nigeria: 'ng', 'Costa Rica': 'cr',
    Argentina: 'ar', Poland: 'pl', Egypt: 'eg', 'New Zealand': 'nz',
    Brazil: 'br', Serbia: 'rs', Cameroon: 'cm', 'Saudi Arabia': 'sa',
    England: 'gb-eng', Wales: 'gb-wls', Algeria: 'dz', Peru: 'pe',
    Germany: 'de', Sweden: 'se', "Côte d'Ivoire": 'ci', Qatar: 'qa',
    Portugal: 'pt', Uruguay: 'uy', 'South Korea': 'kr', Panama: 'pa',
    Colombia: 'co', Austria: 'at', Mali: 'ml', Uzbekistan: 'uz',
    Italy: 'it', Norway: 'no', Jamaica: 'jm', Chile: 'cl',
  };
  const flag = (name) => `https://flagcdn.com/${CODE[name]}.svg`;

  // ---- 12 groups × 4 teams (48). Group stage complete (3 played each). -----
  // status: 'advanced' (into knockout) | 'eliminated'
  const G = (name, w, d, l, gf, ga, status) => ({
    name, flag: flag(name), code: CODE[name],
    played: 3, won: w, drawn: d, lost: l, gf, ga,
    gd: gf - ga, pts: w * 3 + d, status,
  });
  const groups = {
    A: [ G('Belgium',2,1,0,6,2,'advanced'), G('Canada',2,0,1,5,3,'advanced'), G('Morocco',1,0,2,3,4,'eliminated'), G('Japan',0,1,2,2,7,'eliminated') ],
    B: [ G('Mexico',2,1,0,5,1,'advanced'), G('Croatia',2,0,1,4,3,'advanced'), G('Senegal',1,1,1,4,3,'eliminated'), G('Australia',0,0,3,1,7,'eliminated') ],
    C: [ G('Netherlands',3,0,0,7,1,'advanced'), G('USA',1,1,1,4,4,'advanced'), G('Ghana',1,1,1,3,3,'eliminated'), G('Iran',0,0,3,1,7,'eliminated') ],
    D: [ G('France',3,0,0,8,2,'advanced'), G('Denmark',1,1,1,3,3,'advanced'), G('Ecuador',1,1,1,2,2,'eliminated'), G('Tunisia',0,0,3,1,7,'eliminated') ],
    E: [ G('Spain',2,1,0,6,1,'advanced'), G('Switzerland',2,0,1,4,3,'advanced'), G('Nigeria',1,1,1,3,3,'eliminated'), G('Costa Rica',0,0,3,1,7,'eliminated') ],
    F: [ G('Argentina',3,0,0,7,1,'advanced'), G('Poland',1,1,1,3,3,'advanced'), G('Egypt',1,0,2,2,4,'eliminated'), G('New Zealand',0,1,2,1,5,'eliminated') ],
    G: [ G('Brazil',2,1,0,7,2,'advanced'), G('Serbia',1,1,1,4,4,'advanced'), G('Cameroon',1,1,1,3,3,'eliminated'), G('Saudi Arabia',0,1,2,2,7,'eliminated') ],
    H: [ G('England',2,1,0,5,1,'advanced'), G('Wales',1,2,0,3,2,'advanced'), G('Algeria',0,2,1,2,3,'eliminated'), G('Peru',0,1,2,1,5,'eliminated') ],
    I: [ G('Germany',3,0,0,6,1,'advanced'), G('Sweden',1,1,1,4,4,'advanced'), G("Côte d'Ivoire",1,0,2,3,4,'eliminated'), G('Qatar',0,1,2,2,6,'eliminated') ],
    J: [ G('Portugal',2,1,0,6,2,'advanced'), G('Uruguay',2,0,1,5,3,'advanced'), G('South Korea',1,0,2,3,5,'eliminated'), G('Panama',0,1,2,1,5,'eliminated') ],
    K: [ G('Colombia',2,1,0,5,2,'advanced'), G('Austria',1,1,1,3,3,'eliminated'), G('Mali',1,1,1,3,3,'eliminated'), G('Uzbekistan',0,1,2,2,5,'eliminated') ],
    L: [ G('Italy',2,0,1,4,2,'advanced'), G('Norway',2,0,1,5,3,'eliminated'), G('Jamaica',1,1,1,3,4,'eliminated'), G('Chile',1,1,1,2,3,'eliminated') ],
  };

  // ---- Knockout bracket (Round of 16 → Final + 3rd place) ------------------
  // We are on QUARTERFINAL DAY: R16 complete, two QFs played, two QFs to come.
  const K = (id, home, away, s1, s2, played, date, time, pens) =>
    ({ id, home, away, score1: s1, score2: s2, played, date, time, pens });
  const knockout = {
    r16: [
      K('r16-1','France','Switzerland',2,1,true,'11 Jul','17:00'),
      K('r16-2','Spain','Denmark',3,0,true,'11 Jul','21:00'),
      K('r16-3','Argentina','Wales',2,0,true,'12 Jul','17:00'),
      K('r16-4','England','Poland',1,0,true,'12 Jul','21:00'),
      K('r16-5','Brazil','Sweden',4,1,true,'13 Jul','17:00'),
      K('r16-6','Germany','Serbia',2,2,true,'13 Jul','21:00','4–3'),
      K('r16-7','Portugal','Croatia',1,0,true,'14 Jul','17:00'),
      K('r16-8','Mexico','Uruguay',2,1,true,'14 Jul','21:00'),
    ],
    qf: [
      K('qf-1','France','Spain',2,1,true,'18 Jul','17:00'),
      K('qf-2','Argentina','England',1,0,true,'18 Jul','21:00'),
      K('qf-3','Brazil','Germany',null,null,false,'19 Jul','17:00'),
      K('qf-4','Portugal','Mexico',null,null,false,'19 Jul','21:00'),
    ],
    sf: [
      K('sf-1','France','Argentina',null,null,false,'22 Jul','21:00'),
      K('sf-2','Winner QF3','Winner QF4',null,null,false,'23 Jul','21:00'),
    ],
    final: [ K('final','TBD','TBD',null,null,false,'26 Jul','20:00') ],
    third: [ K('third','TBD','TBD',null,null,false,'25 Jul','17:00') ],
  };

  // ---- Today's slate (drives the hero) -------------------------------------
  const todayDate = '19 Jul';
  const today = knockout.qf.map(m => ({ ...m, stage: 'Quarter-final' }));

  // ---- Sweepstakes: a 24-person office, each drawn one nation --------------
  // alive flag computed from team's deepest surviving round.
  const aliveTeams = new Set([
    'France','Argentina','Brazil','Germany','Portugal','Mexico', // QF teams (still in)
  ]);
  const r16Losers = new Set(['Switzerland','Denmark','Wales','Poland','Sweden','Serbia','Croatia','Uruguay']);
  const qfLosers = new Set(['Spain','England']);
  const entries = [
    { name: 'Aoife Brennan',   team: 'France' },
    { name: 'Marcus Webb',     team: 'Argentina' },
    { name: 'Priya Nair',      team: 'Brazil' },
    { name: 'Tom Sullivan',    team: 'Germany' },
    { name: 'Lena Fischer',    team: 'Portugal' },
    { name: 'Diego Alvarez',   team: 'Mexico' },
    { name: 'Hannah Okafor',   team: 'Spain' },
    { name: 'Jack Donnelly',   team: 'England' },
    { name: 'Yuki Tanaka',     team: 'Switzerland' },
    { name: 'Sofia Rossi',     team: 'Denmark' },
    { name: 'Owen Pritchard',  team: 'Wales' },
    { name: 'Kasia Wójcik',    team: 'Poland' },
    { name: 'Erik Lindqvist',  team: 'Sweden' },
    { name: 'Mila Petrović',   team: 'Serbia' },
    { name: 'Ivo Marković',    team: 'Croatia' },
    { name: 'Lucía Méndez',    team: 'Uruguay' },
    { name: 'Sam Carter',      team: 'Netherlands' },
    { name: 'Grace Mensah',    team: 'Belgium' },
    { name: 'Noah Bennett',    team: 'Colombia' },
    { name: 'Chiara Conti',    team: 'Italy' },
    { name: 'Liam Walsh',      team: 'Canada' },
    { name: 'Amara Diallo',    team: 'Senegal' },
    { name: 'Ben Foster',      team: 'USA' },
    { name: 'Nora Haugen',     team: 'Norway' },
  ];
  // team -> {alive, out_round}
  const teamFate = {};
  for (const e of entries) {
    let alive = aliveTeams.has(e.team);
    let out = null;
    if (r16Losers.has(e.team)) out = 'Round of 16';
    else if (qfLosers.has(e.team)) out = 'Quarter-final';
    else if (!alive) out = 'Group stage';
    teamFate[e.team] = { alive, out };
  }

  // ---- Prize pot -----------------------------------------------------------
  const prize = {
    currency: '£',
    entryFee: 5,
    players: entries.length,
    get pot() { return this.entryFee * this.players; },
    splits: [
      { place: 'Winner',     pct: 60, note: 'Champions of the world' },
      { place: 'Runner-up',  pct: 25, note: 'So close' },
      { place: 'Third place', pct: 10, note: 'Bronze finish' },
      { place: 'Golden boot', pct: 5,  note: 'Drawn the top scorer' },
    ],
  };

  window.WC = {
    CODE, flag, groups, knockout, entries, teamFate, prize,
    today, todayDate,
    tournament: { name: 'FIFA World Cup 2026', host: 'USA · Canada · Mexico', teams: 48 },
    stageLabel: 'Quarter-finals',
  };
})();

</script>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>
<script type="text/babel" data-filename="app/components.jsx">
/* Shared primitives for the WC2026 app. Exports to window. */
(function () {

    return (
      <span

          borderRadius: '50%', overflow: 'hidden', position: 'relative',

          />

  }

  /* A team's name + crest in a row. */
  function TeamTag({ team, size = 28, bold = false, dim = false, reverse = false, nameStyle = {} }) {
    const code = team.code || (window.WC.CODE[team.name]);
    return (
      <span style={{

        }}>{team.name}</span>

  /* Status chip used across tables / cards. */
  function StatusChip({ status }) {
    const map = {
      advanced:   { label: 'Through', bg: 'var(--ink)',    fg: 'var(--canvas)', bd: 'var(--ink)' },
      eliminated: { label: 'Out',     bg: 'transparent',   fg: 'var(--text-muted)', bd: 'var(--border-hairline)' },

    return (
      <span style={{

        fontSize: 12, fontWeight: 700, letterSpacing: '0.4px', textTransform: 'uppercase',
        padding: '4px 12px', borderRadius: 999,

        {status === 'live' && <span style={{ width: 6, height: 6, borderRadius: '50%', background: '#fff' }} />}
        {s.label}

  /* Section header — eyebrow + big headline, optional aside slot. */
  function SectionHead({ eyebrow, title, sub, aside }) {

          {eyebrow && <Eyebrow>{eyebrow}</Eyebrow>}

          {sub && <p style={{ marginTop: 14, maxWidth: 560, color: 'var(--text-muted)', fontSize: 17 }}>{sub}</p>}
        </div>

  }

  /* Soft card surface. */
  function Card({ children, pad = 32, lifted = false, style = {}, ...rest }) {
    return (
      <div {...rest} style={{
        background: 'var(--white)', borderRadius: 'var(--radius-stadium)',

  /* Score pill for a played match. */
  function Score({ a, b, pens, muted = false }) {
    return (
      <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8, fontVariantNumeric: 'tabular-nums' }}>
        <span style={{

        {pens && <span style={{ fontSize: 12, color: 'var(--text-muted)', fontWeight: 700 }}>({pens} pens)</span>}
      </span>
    );
  }

  Object.assign(window, { Crest, TeamTag, StatusChip, SectionHead, Card, Score });
})();

</script>
<script type="text/babel" data-filename="app/hero.jsx">
/* Hero — today's match slate with oversized crests + orbital arc. Exports Hero. */
(function () {

  const DS = window.MastercardInspiredDesignSystem_30cec0;

        <div style={{ position: 'relative', display: 'grid', gridTemplateColumns: '1fr auto 1fr', alignItems: 'center', gap: 'clamp(12px,3vw,40px)', marginTop: 28 }}>

          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16 }}>

            ) : (
              <div style={{ fontSize: 'clamp(28px,4vw,40px)', fontWeight: 500, letterSpacing: '-0.02em', color: 'var(--text-muted)' }}>vs</div>

            <span style={{ marginTop: 10, fontSize: 13, color: 'var(--text-muted)', fontWeight: 700, letterSpacing: '0.4px', textTransform: 'uppercase' }}>{m.stage} · {m.date}</span>
          </div>
          {/* away */}
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16 }}>

  function MiniMatch({ m, onOpen }) {

      <button onClick={onOpen} style={{

        display: 'flex', flexDirection: 'column', gap: 14,

        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>

        <Side name={m.away} score={m.score2} played={m.played} win={m.played && m.score2 > m.score1} />

  }
  function Side({ name, score, played, win }) {
    return (
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10 }}>

      </div>

  function Hero({ onOpenBracket, layout = 'Featured', arcs = true }) {
    const WC = window.WC;
    const featured = WC.today.find(m => !m.played) || WC.today[0];
    const rest = WC.today.filter(m => m.id !== featured.id);
    const even = layout === 'Even slate';
    return (
      <section style={{ paddingTop: 8 }}>
        <div style={{ maxWidth: 760, marginBottom: 36 }}>

          <h1 style={{ marginTop: 18, fontSize: 'clamp(40px, 7vw, 72px)', lineHeight: 0.98, letterSpacing: '-0.03em' }}>
            Quarter-final day.<br />The world is down to eight.
          </h1>
          <p style={{ marginTop: 20, fontSize: 18, color: 'var(--text-muted)', maxWidth: 560 }}>

            <div style={{ display: 'grid', gap: 16 }}>
              {rest.map(m => <MiniMatch key={m.id} m={m} onOpen={onOpenBracket} />)}
            </div>
          </div>
        )}
      </section>
    );
  }

  /* Even-slate variation: four equal cards with stacked crests. */
  function SlateCard({ m, onOpen, arcs }) {
    return (
      <button onClick={onOpen} style={{
        textAlign: 'center', cursor: 'pointer', font: 'inherit', position: 'relative', overflow: 'hidden',
        background: 'var(--white)', border: '1px solid var(--border-hairline)', borderRadius: 'var(--radius-stadium)',
        padding: '28px 22px 24px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14,
        transition: 'transform 140ms ease, box-shadow 140ms ease',
      }}
        onMouseEnter={e => { e.currentTarget.style.transform = 'translateY(-3px)'; e.currentTarget.style.boxShadow = 'var(--shadow-2)'; }}
        onMouseLeave={e => { e.currentTarget.style.transform = 'none'; e.currentTarget.style.boxShadow = 'none'; }}>
        <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.4px', textTransform: 'uppercase', color: 'var(--text-muted)' }}>{m.stage}</span>
        <div style={{ position: 'relative', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 18 }}>
          {arcs && <div style={{ position: 'absolute', top: -14, left: 6, right: 6, height: 40 }}><OrbitArc /></div>}
          <Crest name={m.home} code={window.WC.CODE[m.home]} size={66} dim={m.played && m.score1 < m.score2} />
          <span style={{ fontSize: 13, fontWeight: 700, color: 'var(--text-whisper)' }}>{m.played ? '' : 'v'}</span>
          <Crest name={m.away} code={window.WC.CODE[m.away]} size={66} dim={m.played && m.score2 < m.score1} />
        </div>
        <div style={{ fontSize: 17, fontWeight: 500, letterSpacing: '-0.02em' }}>{m.home} <span style={{ color: 'var(--text-whisper)' }}>—</span> {m.away}</div>

      </button>

  window.Hero = Hero;
})();

</script>
<script type="text/babel" data-filename="app/tabs1.jsx">
/* Tabs part 1 — Sweepstakes, Groups (sortable), Fixtures. */
(function () {
  const { useState, useMemo } = React;
  const DS = window.MastercardInspiredDesignSystem_30cec0;
  const { Eyebrow, Chip, Button } = DS;
  const { Crest, TeamTag, StatusChip, SectionHead, Card, Score } = window;

  /* ----------------------------------------------------------------- GROUPS */
  const SORTS = {
    pts: (a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf,
    gd:  (a, b) => b.gd - a.gd || b.pts - a.pts || b.gf - a.gf,
    gf:  (a, b) => b.gf - a.gf || b.pts - a.pts || b.gd - a.gd,
  };

  function GroupCard({ letter, teams, sortKey, density }) {
    const rows = [...teams].sort(SORTS[sortKey]);
    const rowPad = density === 'compact' ? '8px' : density === 'comfy' ? '16px' : '12px';
    const cols = [
      { k: 'played', label: 'P' }, { k: 'won', label: 'W' }, { k: 'drawn', label: 'D' },
      { k: 'lost', label: 'L' }, { k: 'gd', label: 'GD', sortable: 'gd' }, { k: 'pts', label: 'Pts', sortable: 'pts' },
    ];
    return (
      <Card pad={0} style={{ overflow: 'hidden' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '18px 22px 14px', borderBottom: '1px solid var(--border-hairline)' }}>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 10 }}>
            <span style={{ width: 30, height: 30, borderRadius: '50%', background: 'var(--ink)', color: 'var(--canvas)', display: 'grid', placeItems: 'center', fontWeight: 700, fontSize: 15 }}>{letter}</span>
            <span style={{ fontSize: 13, fontWeight: 700, letterSpacing: '0.4px', textTransform: 'uppercase', color: 'var(--text-muted)' }}>Group {letter}</span>
          </span>
          <span style={{ fontSize: 12, color: 'var(--text-whisper)', fontWeight: 700, letterSpacing: '0.3px', textTransform: 'uppercase' }}>Top 2 advance</span>
        </div>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontVariantNumeric: 'tabular-nums' }}>
          <thead>
            <tr style={{ fontSize: 12, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.3px' }}>
              <th style={{ textAlign: 'left', padding: `8px 22px`, fontWeight: 700 }}>Team</th>
              {cols.map(c => (
                <th key={c.k} style={{ textAlign: 'center', padding: '8px 6px', fontWeight: 700, width: 34 }}>{c.label}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map((t, i) => {
              const through = i < 2;
              return (
                <tr key={t.name} style={{ borderTop: '1px solid var(--border-hairline)', background: through ? 'rgba(20,20,19,0.02)' : 'transparent' }}>
                  <td style={{ padding: `${rowPad} 22px`, position: 'relative' }}>
                    {through && <span style={{ position: 'absolute', left: 0, top: 6, bottom: 6, width: 3, borderRadius: 3, background: 'var(--ink)' }} />}
                    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 10 }}>
                      <span style={{ width: 18, color: 'var(--text-whisper)', fontSize: 13, fontWeight: 700 }}>{i + 1}</span>
                      <Crest name={t.name} code={t.code} size={24} dim={!through} />
                      <span style={{ fontWeight: through ? 500 : 450, color: through ? 'var(--ink)' : 'var(--text-muted)', fontSize: 15 }}>{t.name}</span>
                    </span>
                  </td>
                  {cols.map(c => (
                    <td key={c.k} style={{ textAlign: 'center', padding: `${rowPad} 6px`, fontWeight: c.k === 'pts' ? 700 : 450, fontSize: 15, color: c.k === 'pts' ? 'var(--ink)' : 'var(--text-muted)' }}>
                      {c.k === 'gd' ? (t.gd > 0 ? '+' + t.gd : t.gd) : t[c.k]}
                    </td>
                  ))}
                </tr>
              );
            })}
          </tbody>
        </table>
      </Card>
    );
  }

  function Groups({ density, layout = 'Cards' }) {
    const [sortKey, setSortKey] = useState('pts');
    const g = window.WC.groups;
    const letters = Object.keys(g);
    const sortControl = (
      <div style={{ display: 'inline-flex', alignItems: 'center', gap: 10, background: 'var(--white)', border: '1px solid var(--border-hairline)', borderRadius: 999, padding: 6 }}>
        <span style={{ fontSize: 12, fontWeight: 700, letterSpacing: '0.4px', textTransform: 'uppercase', color: 'var(--text-muted)', paddingLeft: 12 }}>Sort by</span>
        {[['pts', 'Points'], ['gd', 'Goal diff'], ['gf', 'Goals for']].map(([k, label]) => (
          <button key={k} onClick={() => setSortKey(k)} style={{
            font: 'inherit', cursor: 'pointer', border: 'none', borderRadius: 999, padding: '8px 16px',
            fontSize: 14, fontWeight: 500, letterSpacing: '-0.2px',
            background: sortKey === k ? 'var(--ink)' : 'transparent',
            color: sortKey === k ? 'var(--canvas)' : 'var(--ink)', transition: 'all 140ms ease',
          }}>{label}</button>
        ))}
      </div>
    );
    return (
      <section>
        <SectionHead eyebrow="Group stage" title="All twelve groups, settled."
          sub="Three rounds played. The top two of every group march on; the rest go home."
          aside={sortControl} />
        {layout === 'Table'
          ? <GroupsTable g={g} letters={letters} sortKey={sortKey} density={density} />
          : (
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(330px, 1fr))', gap: 24 }}>
              {letters.map(L => <GroupCard key={L} letter={L} teams={g[L]} sortKey={sortKey} density={density} />)}
            </div>
          )}
      </section>
    );
  }

  /* Table layout direction — one continuous full-width standings sheet. */
  function GroupsTable({ g, letters, sortKey, density }) {
    const rowPad = density === 'compact' ? '9px' : density === 'comfy' ? '17px' : '13px';
    const cols = [['played', 'P'], ['won', 'W'], ['drawn', 'D'], ['lost', 'L'], ['gf', 'GF'], ['ga', 'GA'], ['gd', 'GD'], ['pts', 'Pts']];
    return (
      <Card pad={0} style={{ overflow: 'hidden' }}>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontVariantNumeric: 'tabular-nums' }}>
          {letters.map(L => {
            const rows = [...g[L]].sort(SORTS[sortKey]);
            return (
              <tbody key={L}>
                <tr style={{ background: 'var(--cream-lifted)', borderTop: '1px solid var(--border-hairline)' }}>
                  <td colSpan={2} style={{ padding: '12px 28px' }}>
                    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 10 }}>
                      <span style={{ width: 26, height: 26, borderRadius: '50%', background: 'var(--ink)', color: 'var(--canvas)', display: 'grid', placeItems: 'center', fontWeight: 700, fontSize: 13 }}>{L}</span>
                      <span style={{ fontSize: 12, fontWeight: 700, letterSpacing: '0.4px', textTransform: 'uppercase', color: 'var(--text-muted)' }}>Group {L}</span>
                    </span>
                  </td>
                  {cols.map(([k, label]) => <td key={k} style={{ textAlign: 'center', padding: '12px 8px', fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.3px', color: 'var(--text-whisper)', width: 46 }}>{label}</td>)}
                </tr>
                {rows.map((t, i) => {
                  const through = i < 2;
                  return (
                    <tr key={t.name} style={{ borderTop: '1px solid var(--border-hairline)', background: through ? 'rgba(20,20,19,0.015)' : 'transparent' }}>
                      <td style={{ width: 30, padding: `${rowPad} 0 ${rowPad} 28px`, color: 'var(--text-whisper)', fontWeight: 700, fontSize: 13 }}>{i + 1}</td>
                      <td style={{ padding: `${rowPad} 16px`, position: 'relative' }}>
                        {through && <span style={{ position: 'absolute', left: 16, top: 8, bottom: 8, width: 3, borderRadius: 3, background: 'var(--ink)' }} />}
                        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 12, paddingLeft: through ? 12 : 0 }}>
                          <Crest name={t.name} code={t.code} size={26} dim={!through} />
                          <span style={{ fontWeight: through ? 500 : 450, color: through ? 'var(--ink)' : 'var(--text-muted)', fontSize: 16 }}>{t.name}</span>
                          {i === 0 && <StatusChip status="advanced" />}
                        </span>
                      </td>
                      {cols.map(([k]) => (
                        <td key={k} style={{ textAlign: 'center', padding: `${rowPad} 8px`, fontWeight: k === 'pts' ? 700 : 450, fontSize: 16, color: k === 'pts' ? 'var(--ink)' : 'var(--text-muted)' }}>
                          {k === 'gd' ? (t.gd > 0 ? '+' + t.gd : t.gd) : t[k]}
                        </td>
                      ))}
                    </tr>
                  );
                })}
              </tbody>
            );
          })}
        </table>
      </Card>
    );
  }

  /* -------------------------------------------------------------- FIXTURES */
  const ROUND_LABELS = { r16: 'Round of 16', qf: 'Quarter-finals', sf: 'Semi-finals', third: 'Third place', final: 'Final' };
  function Fixtures({ density }) {
    const K = window.WC.knockout;
    const order = ['r16', 'qf', 'sf', 'final'];
    const [round, setRound] = useState('qf');
    const list = K[round] || [];
    const rowPad = density === 'compact' ? '14px' : density === 'comfy' ? '26px' : '20px';
    return (
      <section>
        <SectionHead eyebrow="Match results" title="The knockout fixtures."
          sub="Every tie from the Round of 16 to the final. Group results live under Groups." />
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 28 }}>
          {order.map(r => (
            <button key={r} onClick={() => setRound(r)} style={{
              font: 'inherit', cursor: 'pointer', borderRadius: 999, padding: '10px 22px', fontSize: 15, fontWeight: 500,
              border: `1.5px solid ${round === r ? 'var(--ink)' : 'var(--border-hairline)'}`,
              background: round === r ? 'var(--ink)' : 'var(--white)', color: round === r ? 'var(--canvas)' : 'var(--ink)',
              transition: 'all 140ms ease',
            }}>{ROUND_LABELS[r]}</button>
          ))}
        </div>
        <Card pad={0} style={{ overflow: 'hidden' }}>
          {list.map((m, i) => {
            const homeWin = m.played && m.score1 > m.score2;
            const awayWin = m.played && m.score2 > m.score1;
            return (
              <div key={m.id} style={{
                display: 'grid', gridTemplateColumns: '88px 1fr auto 1fr', alignItems: 'center', gap: 16,
                padding: `${rowPad} 28px`, borderTop: i ? '1px solid var(--border-hairline)' : 'none',
              }} className="wc-fixture-row">
                <span style={{ fontSize: 13, fontWeight: 700, color: 'var(--text-muted)', letterSpacing: '0.3px' }}>{m.date}<br /><span style={{ color: 'var(--text-whisper)', fontWeight: 450 }}>{m.time}</span></span>
                <span style={{ display: 'inline-flex', alignItems: 'center', gap: 12, justifyContent: 'flex-end', textAlign: 'right' }}>
                  <span style={{ fontWeight: homeWin ? 500 : 450, color: m.played && !homeWin ? 'var(--text-muted)' : 'var(--ink)', fontSize: 17 }}>{m.home}</span>
                  <Crest name={m.home} code={window.WC.CODE[m.home]} size={34} dim={m.played && !homeWin} />
                </span>
                <span style={{ textAlign: 'center', minWidth: 96 }}>
                  {m.played
                    ? <Score a={m.score1} b={m.score2} pens={m.pens} />
                    : <span style={{ display: 'inline-block', fontSize: 13, fontWeight: 700, letterSpacing: '0.4px', textTransform: 'uppercase', color: 'var(--signal-orange)', padding: '6px 16px', border: '1px solid var(--border-hairline)', borderRadius: 999 }}>{m.time}</span>}
                </span>
                <span style={{ display: 'inline-flex', alignItems: 'center', gap: 12 }}>
                  <Crest name={m.away} code={window.WC.CODE[m.away]} size={34} dim={m.played && !awayWin} />
                  <span style={{ fontWeight: awayWin ? 500 : 450, color: m.played && !awayWin ? 'var(--text-muted)' : 'var(--ink)', fontSize: 17 }}>{m.away}</span>
                </span>
              </div>
            );
          })}
        </Card>
      </section>
    );
  }

  /* ------------------------------------------------------------ SWEEPSTAKES */
  function Sweepstakes({ density }) {
    const WC = window.WC;
    const enriched = WC.entries.map(e => {
      const f = WC.teamFate[e.team] || { alive: false, out: 'Group stage' };
      return { ...e, ...f };
    });
    const depth = { 'Quarter-final': 4, 'Round of 16': 3, 'Group stage': 1 };
    enriched.sort((a, b) => (b.alive - a.alive) || ((b.alive ? 0 : depth[b.out] || 0) - (a.alive ? 0 : depth[a.out] || 0)) || a.name.localeCompare(b.name));
    const aliveCount = enriched.filter(e => e.alive).length;
    return (
      <section>
        <SectionHead eyebrow="The office sweepstakes" title="Who's still standing?"
          sub={`${WC.entries.length} colleagues, one nation each, drawn from the hat. ${aliveCount} are still in the running.`}
          aside={
            <div style={{ display: 'flex', gap: 12 }}>
              <Stat n={aliveCount} label="Still in" accent />
              <Stat n={WC.entries.length - aliveCount} label="Knocked out" />
            </div>
          } />
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: 16 }}>
          {enriched.map(e => <EntryCard key={e.name} e={e} density={density} />)}
        </div>
      </section>
    );
  }
  function Stat({ n, label, accent }) {
    return (
      <div style={{ textAlign: 'center', padding: '10px 20px', borderRadius: 'var(--radius-btn)', background: accent ? 'var(--ink)' : 'var(--white)', border: '1px solid', borderColor: accent ? 'var(--ink)' : 'var(--border-hairline)', color: accent ? 'var(--canvas)' : 'var(--ink)' }}>
        <div style={{ fontSize: 30, fontWeight: 500, letterSpacing: '-0.02em', lineHeight: 1 }}>{n}</div>
        <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: '0.3px', textTransform: 'uppercase', marginTop: 4, opacity: 0.7 }}>{label}</div>
      </div>
    );
  }
  function EntryCard({ e, density }) {
    const pad = density === 'compact' ? 16 : density === 'comfy' ? 28 : 20;
    return (
      <div style={{
        background: 'var(--white)', border: '1px solid var(--border-hairline)', borderRadius: 'var(--radius-btn)',
        padding: pad, display: 'flex', alignItems: 'center', gap: 14,
        opacity: e.alive ? 1 : 0.78, transition: 'transform 140ms ease, box-shadow 140ms ease',
      }}
        onMouseEnter={ev => { ev.currentTarget.style.transform = 'translateY(-2px)'; ev.currentTarget.style.boxShadow = 'var(--shadow-2)'; }}
        onMouseLeave={ev => { ev.currentTarget.style.transform = 'none'; ev.currentTarget.style.boxShadow = 'none'; }}>
        <Crest name={e.team} code={window.WC.CODE[e.team]} size={46} dim={!e.alive} />
        <div style={{ minWidth: 0, flex: 1 }}>
          <div style={{ fontWeight: 500, letterSpacing: '-0.2px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{e.name}</div>
          <div style={{ fontSize: 14, color: 'var(--text-muted)' }}>{e.team}</div>
        </div>
        {e.alive
          ? <StatusChip status="advanced" />
          : <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.3px', textTransform: 'uppercase', color: 'var(--text-whisper)', textAlign: 'right', lineHeight: 1.3 }}>Out<br />{e.out}</span>}
      </div>
    );
  }

  Object.assign(window, { Groups, Fixtures, Sweepstakes });
})();

</script>
<script type="text/babel" data-filename="app/tabs2.jsx">
/* Tabs part 2 — Bracket (animated) + Prize. */
(function () {
  const { useState, useRef, useLayoutEffect, useEffect, useCallback } = React;
  const DS = window.MastercardInspiredDesignSystem_30cec0;
  const { Eyebrow, Button } = DS;
  const { Crest, SectionHead, Card } = window;

  const PARENT = {
    'r16-1': 'qf-1', 'r16-2': 'qf-1', 'r16-3': 'qf-2', 'r16-4': 'qf-2',
    'r16-5': 'qf-3', 'r16-6': 'qf-3', 'r16-7': 'qf-4', 'r16-8': 'qf-4',
    'qf-1': 'sf-1', 'qf-2': 'sf-1', 'qf-3': 'sf-2', 'qf-4': 'sf-2',
    'sf-1': 'final', 'sf-2': 'final',
  };
  const ROUND_ORDER = ['r16', 'qf', 'sf', 'final'];
  const ROUND_TITLES = { r16: 'Round of 16', qf: 'Quarter-finals', sf: 'Semi-finals', final: 'Final' };
  const winnerOf = (m) => (!m.played ? null : m.score1 > m.score2 ? m.home : m.away);

  function MatchNode({ m, nodeRef, live }) {
    const w = winnerOf(m);
    const Side = ({ name, score, isWin, isLoss }) => {
      const tbd = name === 'TBD' || name.startsWith('Winner');
      return (
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '7px 10px', justifyContent: 'space-between' }}>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8, minWidth: 0, flex: 1 }}>
            {tbd
              ? <span style={{ width: 22, height: 22, borderRadius: '50%', background: 'var(--bone)', flex: 'none', boxShadow: 'inset 0 0 0 1px var(--border-hairline)' }} />
              : <Crest name={name} code={window.WC.CODE[name]} size={22} dim={isLoss} />}
            <span style={{ fontSize: 14, fontWeight: isWin ? 500 : 450, color: tbd ? 'var(--text-whisper)' : isLoss ? 'var(--text-muted)' : 'var(--ink)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{tbd ? (name === 'TBD' ? 'To be decided' : name) : name}</span>
          </span>
          <span style={{ fontSize: 15, fontWeight: 600, fontVariantNumeric: 'tabular-nums', color: m.played ? (isWin ? 'var(--ink)' : 'var(--text-muted)') : 'var(--text-whisper)' }}>{m.played ? score : ''}</span>
        </div>
      );
    };
    return (
      <div ref={nodeRef} data-match={m.id} style={{
        width: 210, background: 'var(--white)', borderRadius: 14,
        border: `1.5px solid ${live ? 'var(--signal-orange)' : 'var(--border-hairline)'}`,
        boxShadow: live ? '0 0 0 4px rgba(243,115,56,0.14), var(--shadow-2)' : 'var(--shadow-1)',
        overflow: 'hidden', transition: 'border-color 300ms ease, box-shadow 300ms ease',
      }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '5px 10px', borderBottom: '1px solid var(--border-hairline)', background: 'var(--cream-lifted)' }}>
          <span style={{ fontSize: 10, fontWeight: 700, letterSpacing: '0.4px', textTransform: 'uppercase', color: 'var(--text-muted)', whiteSpace: 'nowrap' }}>{m.date}</span>
          {m.pens && <span style={{ fontSize: 10, fontWeight: 700, color: 'var(--text-muted)' }}>{m.pens} pens</span>}
          {!m.played && <span style={{ fontSize: 10, fontWeight: 700, color: 'var(--signal-orange)' }}>{m.time}</span>}
        </div>
        <Side name={m.home} score={m.score1} isWin={w === m.home} isLoss={m.played && w !== m.home} />
        <div style={{ height: 1, background: 'var(--border-hairline)', margin: '0 10px' }} />
        <Side name={m.away} score={m.score2} isWin={w === m.away} isLoss={m.played && w !== m.away} />
      </div>
    );
  }

  function Bracket() {
    const K = window.WC.knockout;
    const wrapRef = useRef(null);
    const svgRef = useRef(null);
    const nodes = useRef({});
    const [paths, setPaths] = useState([]);
    const [dims, setDims] = useState({ w: 0, h: 0 });
    const [liveRound, setLiveRound] = useState(-1); // -1 = all static
    const playingRef = useRef(false);

    const setNode = useCallback((id) => (el) => { if (el) nodes.current[id] = el; }, []);

    const measure = useCallback(() => {
      const wrap = wrapRef.current; if (!wrap) return;
      const wr = wrap.getBoundingClientRect();
      const out = [];
      for (const [child, parent] of Object.entries(PARENT)) {
        const c = nodes.current[child], p = nodes.current[parent];
        if (!c || !p) continue;
        const cr = c.getBoundingClientRect(), pr = p.getBoundingClientRect();
        const x1 = cr.right - wr.left, y1 = cr.top - wr.top + cr.height / 2;
        const x2 = pr.left - wr.left, y2 = pr.top - wr.top + pr.height / 2;
        const mx = x1 + (x2 - x1) / 2;
        const round = child.split('-')[0];
        out.push({ key: child, d: `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`, round });
      }
      setDims({ w: wrap.scrollWidth, h: wrap.scrollHeight });
      setPaths(out);
    }, []);

    useLayoutEffect(() => { measure(); }, [measure]);
    useEffect(() => {
      const t = setTimeout(measure, 350); // after flags/fonts settle
      window.addEventListener('resize', measure);
      return () => { clearTimeout(t); window.removeEventListener('resize', measure); };
    }, [measure]);

    const play = useCallback(() => {
      if (playingRef.current) return;
      playingRef.current = true;
      setLiveRound(0);
      let r = 0;
      const tick = () => {
        r += 1;
        if (r >= ROUND_ORDER.length) { setLiveRound(-1); playingRef.current = false; return; }
        setLiveRound(r);
        setTimeout(tick, 900);
      };
      setTimeout(tick, 900);
    }, []);

    const roundIndex = (id) => ROUND_ORDER.indexOf(id.split('-')[0]);

    return (
      <section>
        <SectionHead eyebrow="Knockout bracket" title="The road to the final."
          sub="Sixteen became eight. Watch the run unfold, then follow it to a champion."
          aside={<Button variant="primary" onClick={play}>▶ Play the run</Button>} />

        <div style={{ overflowX: 'auto', paddingBottom: 12 }}>
          <div ref={wrapRef} style={{ position: 'relative', minWidth: 1000 }}>
            <svg ref={svgRef} width={dims.w} height={dims.h} style={{ position: 'absolute', inset: 0, pointerEvents: 'none', overflow: 'visible' }}>
              {paths.map(p => {
                const active = liveRound === -1 || roundIndex(p.key) < liveRound;
                const live = roundIndex(p.key) === liveRound;
                return <path key={p.key} d={p.d} fill="none"
                  stroke={live ? 'var(--signal-orange)' : 'var(--accent-orbit)'}
                  strokeWidth={live ? 2.5 : 1.5}
                  strokeLinecap="round"
                  style={{ opacity: active ? 1 : 0.35, transition: 'opacity 400ms ease, stroke 300ms ease' }} />;
              })}
            </svg>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 210px)', gap: 56, position: 'relative' }}>
              {ROUND_ORDER.map((rk, col) => (
                <div key={rk} style={{ display: 'flex', flexDirection: 'column', justifyContent: 'space-around', gap: col === 0 ? 16 : 0 }}>
                  <div style={{ textAlign: 'center', fontSize: 12, fontWeight: 700, letterSpacing: '0.5px', textTransform: 'uppercase', color: 'var(--text-muted)', marginBottom: 8 }}>{ROUND_TITLES[rk]}</div>
                  <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'space-around', gap: 16 }}>
                    {K[rk].map(m => (
                      <MatchNode key={m.id} m={m} nodeRef={setNode(m.id)} live={liveRound === col} />
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* third place */}
        <div style={{ marginTop: 28, display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap' }}>
          <span style={{ fontSize: 12, fontWeight: 700, letterSpacing: '0.5px', textTransform: 'uppercase', color: 'var(--text-muted)' }}>Third-place play-off</span>
          <span style={{ fontSize: 15, color: 'var(--text-muted)' }}>{K.third[0].date} · {K.third[0].time} — qualifiers to be confirmed.</span>
        </div>
      </section>
    );
  }

  /* ----------------------------------------------------------------- PRIZE */
  function Prize() {
    const P = window.WC.prize;
    const fmt = (n) => P.currency + n.toLocaleString();
    return (
      <section>
        <SectionHead eyebrow="The pot" title="What you're playing for."
          sub={`Everyone put in ${fmt(P.entryFee)}. Winner takes the lion's share — the rest is settled when the whistle blows on the final.`} />

        <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1fr) minmax(0,1.4fr)', gap: 24, alignItems: 'stretch' }} className="wc-prize-grid">
          {/* pot hero */}
          <div style={{ position: 'relative', overflow: 'hidden', background: 'var(--ink)', color: 'var(--canvas)', borderRadius: 'var(--radius-stadium)', padding: 40, display: 'flex', flexDirection: 'column', justifyContent: 'space-between', minHeight: 320 }}>
            <div className="mc-ghost" style={{ position: 'absolute', right: -20, bottom: -50, color: 'rgba(255,255,255,0.06)', fontSize: 200, lineHeight: 1 }}>£</div>
            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8, fontSize: 13, fontWeight: 700, letterSpacing: '0.5px', textTransform: 'uppercase', color: 'var(--signal-orange-light)' }}>
              <span style={{ width: 8, height: 8, borderRadius: '50%', background: 'var(--signal-orange)' }} />Total pot
            </span>
            <div style={{ position: 'relative' }}>
              <div style={{ fontSize: 'clamp(60px,9vw,92px)', fontWeight: 500, letterSpacing: '-0.04em', lineHeight: 1 }}>{fmt(P.pot)}</div>
              <div style={{ marginTop: 14, display: 'flex', gap: 28 }}>
                <KV k="Players" v={P.players} />
                <KV k="Entry" v={fmt(P.entryFee)} />
              </div>
            </div>
          </div>

          {/* splits */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px,1fr))', gap: 16 }}>
            {P.splits.map((s, i) => (
              <div key={s.place} style={{ background: 'var(--white)', border: '1px solid var(--border-hairline)', borderRadius: 'var(--radius-btn)', padding: 28, display: 'flex', flexDirection: 'column', gap: 6, boxShadow: i === 0 ? 'var(--shadow-2)' : 'none' }}>
                <span style={{ fontSize: 12, fontWeight: 700, letterSpacing: '0.4px', textTransform: 'uppercase', color: 'var(--text-muted)' }}>{s.place}</span>
                <span style={{ fontSize: 38, fontWeight: 500, letterSpacing: '-0.03em', lineHeight: 1 }}>{fmt(Math.round(P.pot * s.pct / 100))}</span>
                <span style={{ fontSize: 14, color: 'var(--text-muted)' }}>{s.pct}% · {s.note}</span>
              </div>
            ))}
          </div>
        </div>
      </section>
    );
  }
  function KV({ k, v }) {
    return (
      <div>
        <div style={{ fontSize: 13, letterSpacing: '0.4px', textTransform: 'uppercase', fontWeight: 700, color: 'rgba(243,240,238,0.5)' }}>{k}</div>
        <div style={{ fontSize: 24, fontWeight: 500, letterSpacing: '-0.02em' }}>{v}</div>
      </div>
    );
  }

  Object.assign(window, { Bracket, Prize });
})();

</script>
<script type="text/babel" data-filename="app/app.jsx">
/* App shell — floating pill nav, tab routing, tweaks, footer. */
(function () {
  const { useState } = React;
  const DS = window.MastercardInspiredDesignSystem_30cec0;
  const { Footer } = DS;
  const { useTweaks, TweaksPanel, TweakSection, TweakRadio, TweakToggle } = window;
  const { Hero, Sweepstakes, Groups, Fixtures, Bracket, Prize } = window;

  const TABS = ['Today', 'Sweepstakes', 'Groups', 'Fixtures', 'Bracket', 'Prize'];

  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "heroLayout": "Featured",
    "groupsLayout": "Cards",
    "density": "regular",
    "arcs": true
  }/*EDITMODE-END*/;

  function Brand({ onClick }) {
    return (
      <button onClick={onClick} style={{ display: 'inline-flex', alignItems: 'center', gap: 12, background: 'none', border: 'none', cursor: 'pointer', font: 'inherit', padding: 0, flex: 'none' }}>
        <span style={{ width: 40, height: 40, borderRadius: '50%', background: 'var(--ink)', color: 'var(--canvas)', display: 'grid', placeItems: 'center', fontWeight: 700, fontSize: 16, letterSpacing: '-0.02em' }}>26</span>
        <span style={{ textAlign: 'left', lineHeight: 1.15, whiteSpace: 'nowrap' }}>
          <span style={{ display: 'block', fontWeight: 600, fontSize: 15, letterSpacing: '-0.02em' }}>World Cup 2026</span>
          <span style={{ display: 'block', fontSize: 12, color: 'var(--text-muted)', fontWeight: 500, letterSpacing: '0.2px' }}>Office sweepstakes</span>
        </span>
      </button>
    );
  }

  function Nav({ tab, setTab }) {
    return (
      <div style={{ position: 'sticky', top: 16, zIndex: 30, display: 'flex', justifyContent: 'center', padding: '0 16px', marginBottom: 40 }}>
        <nav style={{
          display: 'flex', alignItems: 'center', gap: 20, maxWidth: 1180, width: '100%',
          background: 'var(--white)', borderRadius: 999, boxShadow: 'var(--shadow-2)',
          border: '1px solid var(--border-hairline)', padding: '10px 12px 10px 20px',
        }}>
          <Brand onClick={() => setTab('Today')} />
          <div style={{ flex: 1, display: 'flex', justifyContent: 'flex-end', gap: 4, overflowX: 'auto', scrollbarWidth: 'none' }} className="wc-navtabs">
            {TABS.map(t => {
              const active = tab === t;
              return (
                <button key={t} onClick={() => setTab(t)} style={{
                  font: 'inherit', cursor: 'pointer', border: 'none', borderRadius: 999, whiteSpace: 'nowrap',
                  padding: '10px 18px', fontSize: 15, fontWeight: 500, letterSpacing: '-0.3px',
                  background: active ? 'var(--ink)' : 'transparent', color: active ? 'var(--canvas)' : 'var(--ink)',
                  transition: 'background 160ms ease, color 160ms ease, opacity 160ms ease',
                }}
                  onMouseEnter={e => { if (!active) e.currentTarget.style.opacity = 0.6; }}
                  onMouseLeave={e => { e.currentTarget.style.opacity = 1; }}>{t}</button>
              );
            })}
          </div>
        </nav>
      </div>
    );
  }

  function App() {
    const [tab, setTab] = useState('Today');
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

    const view = (() => {
      switch (tab) {
        case 'Today': return <Hero onOpenBracket={() => setTab('Bracket')} layout={t.heroLayout} arcs={t.arcs} />;
        case 'Sweepstakes': return <Sweepstakes density={t.density} />;
        case 'Groups': return <Groups density={t.density} layout={t.groupsLayout} />;
        case 'Fixtures': return <Fixtures density={t.density} />;
        case 'Bracket': return <Bracket arcs={t.arcs} />;
        case 'Prize': return <Prize />;
        default: return null;
      }
    })();

    const footerCols = [
      { title: 'Tournament', links: [{ label: 'Schedule' }, { label: 'Venues' }, { label: 'All 48 teams' }] },
      { title: 'Sweepstakes', links: [{ label: 'House rules' }, { label: 'Entries' }, { label: 'Prize pot' }] },
      { title: 'The office', links: [{ label: 'Slack channel', external: true }, { label: 'Shared calendar', external: true }] },
    ];

    return (
      <div data-app style={{ minHeight: '100vh', paddingTop: 16 }}>
        <Nav tab={tab} setTab={setTab} />
        <main className="mc-container" style={{ paddingBottom: 100, maxWidth: 1180 }}>
          {view}
        </main>
        <Footer headline="May the best desk win." columns={footerCols} country="England · English" />

        <TweaksPanel>
          <TweakSection label="Layout directions" />
          <TweakRadio label="Today" value={t.heroLayout} options={['Featured', 'Even slate']} onChange={v => setTweak('heroLayout', v)} />
          <TweakRadio label="Standings" value={t.groupsLayout} options={['Cards', 'Table']} onChange={v => setTweak('groupsLayout', v)} />
          <TweakSection label="Display" />
          <TweakRadio label="Density" value={t.density} options={['compact', 'regular', 'comfy']} onChange={v => setTweak('density', v)} />
          <TweakToggle label="Orbital arcs" value={t.arcs} onChange={v => setTweak('arcs', v)} />
        </TweaksPanel>
      </div>
    );
  }

  window.WCApp = App;
})();

</script>
<script type="text/babel">
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(React.createElement(window.WCApp));
  setTimeout(() => {
    const l = document.getElementById('wc-loading');
    if (l) { l.style.opacity = '0'; setTimeout(() => l.remove(), 450); }
  }, 600);
</script>
